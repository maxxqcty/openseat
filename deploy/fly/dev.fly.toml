# Fly.io configuration for the dev environment (app `openseat-dev`).
#
# One file per app; this is the dev half of the pair in issue #15. Secrets are
# never stored here — they live in `deploy/fly/dev.secrets` (git-ignored) and
# are applied with `make fly-secrets`. Apply with:
#
#     make fly-deploy ENV=dev
#
# Region: `fra` (Frankfurt) by default. Change `primary_region` here *and* the
# `REGION` value in scripts/fly.py's defaults before the first `make fly-create`
# — a region cannot be changed afterwards without recreating the app.

app = "openseat-dev"
primary_region = "fra"

[deploy]
  # Runs in a temporary machine from the same image before the new release
  # starts. The Docker entrypoint executes it and exits with its status, so a
  # failing migration fails the deploy instead of shipping it.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true

  # Keep exactly one machine running for the demo: Fly may stop Machines when
  # idle, but `min_machines_running = 1` holds one warm in the primary region.
  # Count is set with `fly scale count 1` (scripts/fly.py `create`).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
