name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openseat
          POSTGRES_PASSWORD: openseat
          POSTGRES_DB: openseat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openseat -d openseat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://openseat:openseat@localhost:5432/openseat_test
      TEST_DATABASE_URL: postgresql+psycopg://openseat:openseat@localhost:5432/openseat_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy app
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Check for migration drift
        run: uv run alembic check
      - name: Test
        run: uv run pytest

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check OpenAPI contract
        run: uv run python ../scripts/check_contract.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, contract, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the image tag
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          image_tag="${timestamp}-${short_sha}"
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:${image_tag}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=openseat-image-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Build the root Dockerfile once
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -t "openseat:${IMAGE_TAG}" .
      - name: Save the exact image for the E2E gate
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker save "openseat:${IMAGE_TAG}" | gzip > /tmp/openseat-image.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/openseat-image.tar.gz
          retention-days: 1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the main image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker tag "openseat:${IMAGE_TAG}" "${IMAGE_REF}"
          docker push "${IMAGE_REF}"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    env:
      SESSION_SECRET: e2e-session-secret-0123456789abcdef0123456789
      E2E_IMAGE: openseat-app:latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the built image
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /tmp
      - name: Load the exact image used by the build job
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker load < /tmp/openseat-image.tar.gz
          docker tag "openseat:${IMAGE_TAG}" openseat-app:latest
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the suite against the built image
        run: make e2e PYTHON=python3
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: demo
      url: https://open-seat.onrender.com
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install backend tooling
        working-directory: backend
        run: uv sync --locked
      - name: Trigger the guarded Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        working-directory: backend
        run: uv run python ../scripts/render.py deploy-hook
      - name: Warn when the deploy hook is missing
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK_URL is not set. Configure the Render deploy hook to guarantee the E2E gate; checksPass auto-deploy remains the fallback."
      - name: Verify the deployed commit
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        working-directory: backend
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: uv run python ../scripts/render.py verify
